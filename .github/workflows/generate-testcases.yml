name: Generate testcases

on:
  workflow_dispatch:
    inputs:
      target_repository_path:
        description: Repository-relative folder to analyze
        required: false
        default: tests/TestimusPrime.Tests/Fixtures/SampleApi
      test_suite_version_tag:
        description: Optional custom prefix for the generated test suite version tag
        required: false
        default: ""
      create_git_tag:
        description: Push a matching git tag for the generated test suite version
        required: false
        default: "true"

permissions:
  actions: read
  contents: write

jobs:
  generate-testcases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore /home/runner/work/TestimusPrime/TestimusPrime/TestimusPrime.slnx

      - name: Resolve workflow paths
        id: paths
        run: |
          set -euo pipefail
          target_path="${GITHUB_WORKSPACE}/${{ inputs.target_repository_path }}"
          if [ ! -d "$target_path" ]; then
            echo "Target repository path does not exist: $target_path"
            exit 1
          fi

          version_tag="${{ inputs.test_suite_version_tag }}"
          if [ -z "$version_tag" ]; then
            version_tag="testcases-run-${GITHUB_RUN_ID}"
          else
            version_tag="$(python "${GITHUB_WORKSPACE}/.github/scripts/generated_suite_version.py" normalize-provided-tag --version-tag "$version_tag" --run-id "${GITHUB_RUN_ID}")"
          fi

          output_dir="${GITHUB_WORKSPACE}/artifacts/generated-testcases/${version_tag}"
          suite_file="${output_dir}/${version_tag}.json"
          artifact_name="generated-testcases-${version_tag}"

          echo "target_path=$target_path" >> "$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "suite_file=$suite_file" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Generate versioned testcases
        run: >
          dotnet run --project /home/runner/work/TestimusPrime/TestimusPrime/src/TestimusPrime.Runner --
          --mode=Generate
          --repo=${{ steps.paths.outputs.target_path }}
          --output=${{ steps.paths.outputs.output_dir }}
          --version-tag=${{ steps.paths.outputs.version_tag }}

      - name: Upload generated testcase artifact
        id: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.paths.outputs.artifact_name }}
          path: ${{ steps.paths.outputs.output_dir }}

      - name: Create git tag for generated testcases
        if: ${{ inputs.create_git_tag == 'true' }}
        run: |
          set -euo pipefail
          tag_name="${{ steps.paths.outputs.version_tag }}"
          if git rev-parse "$tag_name" >/dev/null 2>&1; then
            echo "Tag already exists: $tag_name"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag_name"
          git push origin "refs/tags/$tag_name"

      - name: Summarize generated testcase suite
        if: always()
        env:
          API_REPOSITORY: ${{ github.repository }}
          API_REPOSITORY_PATH: ${{ inputs.target_repository_path }}
          VERSION_TAG: ${{ steps.paths.outputs.version_tag }}
          ARTIFACT_NAME: ${{ steps.paths.outputs.artifact_name }}
          ARTIFACT_ID: ${{ steps.upload_artifact.outputs['artifact-id'] }}
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs['artifact-url'] }}
          ARTIFACTS_FOLDER: ${{ steps.paths.outputs.output_dir }}
          SUITE_FILE: ${{ steps.paths.outputs.suite_file }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from collections.abc import Mapping
          from pathlib import Path

          def escape_cell(value):
              text = "" if value is None else str(value)
              return text.replace("|", "\\|").replace("\n", "<br>")

          def classify_test_case(test_case):
              normalized_status_codes = []
              for code in (test_case.get("expectedStatusCodes") or []):
                  try:
                      normalized_status_codes.append(int(code))
                  except (TypeError, ValueError):
                      return "Unclassified"

              if not normalized_status_codes:
                  return "Unclassified"

              if all(code >= 400 for code in normalized_status_codes):
                  return "Negative"

              if all(code < 400 for code in normalized_status_codes):
                  return "Positive"

              return "Unclassified"

          def normalized_suites(test_case):
              suite_map = {
                  0: "Smoke",
                  1: "Regression",
                  "0": "Smoke",
                  "1": "Regression",
                  "Smoke": "Smoke",
                  "Regression": "Regression",
              }
              return {suite_map.get(suite, str(suite)) for suite in (test_case.get("suites") or [])}

          def suite_counts(test_cases, suite_name):
              return sum(1 for test_case in test_cases if suite_name in normalized_suites(test_case))

          def endpoint_key(endpoint):
              if not isinstance(endpoint, Mapping):
                  return None

              endpoint_id = endpoint.get("id")
              if endpoint_id is not None:
                  return f"id:{endpoint_id}"

              http_method = endpoint.get("httpMethod")
              route = endpoint.get("route")
              source_file = endpoint.get("sourceFile")
              source_line = endpoint.get("sourceLine")

              if http_method is None or route is None:
                  return None

              return f"fallback:{http_method}|{route}|{source_file}|{source_line}"

          suite_path = Path(os.environ["SUITE_FILE"])
          suite = None
          suite_error = None

          if suite_path.is_file():
              try:
                  suite = json.loads(suite_path.read_text(encoding="utf-8"))
                  if not isinstance(suite, Mapping):
                      suite_error = f"Generated suite JSON must be an object, found {type(suite).__name__}."
                      suite = None
              except Exception as exc:  # summary generation must remain best-effort
                  suite_error = f"Unable to read generated suite JSON: {exc}"
          else:
              suite_error = f"Generated suite file not found at {suite_path}"

          print("## Generated testcase suite summary")
          print()
          print("| Field | Value |")
          print("| --- | --- |")
          print(f"| API repository | `{escape_cell(os.environ['API_REPOSITORY'])}` |")
          print(f"| API repository path | `{escape_cell(os.environ['API_REPOSITORY_PATH'])}` |")
          print(f"| Version | `{escape_cell(os.environ['VERSION_TAG'])}` |")
          print(f"| Artifact name | `{escape_cell(os.environ['ARTIFACT_NAME'])}` |")
          print(f"| Artifact ID | `{escape_cell(os.environ['ARTIFACT_ID'])}` |")
          print(f"| Artifact URL | {escape_cell(os.environ['ARTIFACT_URL'])} |")
          print(f"| Artifacts folder | `{escape_cell(os.environ['ARTIFACTS_FOLDER'])}` |")
          print(f"| Generated suite file | `{escape_cell(os.environ['SUITE_FILE'])}` |")
          print(f"| Workflow run ID | `{escape_cell(os.environ['WORKFLOW_RUN_ID'])}` |")
          print()

          if suite is not None:
              analysis = suite.get("analysis") or {}
              endpoints = analysis.get("endpoints") or []
              test_cases = suite.get("testCases") or []
              positive_count = sum(1 for test_case in test_cases if classify_test_case(test_case) == "Positive")
              negative_count = sum(1 for test_case in test_cases if classify_test_case(test_case) == "Negative")
              unclassified_count = len(test_cases) - positive_count - negative_count
              endpoint_test_cases = {}

              for test_case in test_cases:
                  key = endpoint_key(test_case.get("endpoint") or {})
                  if key is not None:
                      endpoint_test_cases.setdefault(key, []).append(test_case)

              print("### Generated testcase counts")
              print()
              print("| Category | Count |")
              print("| --- | ---: |")
              print(f"| Endpoints detected | {len(endpoints)} |")
              print(f"| Total testcases | {len(test_cases)} |")
              print(f"| Smoke | {suite_counts(test_cases, 'Smoke')} |")
              print(f"| Regression | {suite_counts(test_cases, 'Regression')} |")
              print(f"| Positive | {positive_count} |")
              print(f"| Negative | {negative_count} |")
              print(f"| Unclassified | {unclassified_count} |")
              print()

              notes = analysis.get("notes") or []
              if notes:
                  print("### Analysis notes")
                  print()
                  for note in notes:
                      print(f"- {escape_cell(note)}")
                  print()

              print(f"### Detected endpoints ({len(endpoints)})")
              print()
              print("| Method | Route | Source | Tests | Smoke | Regression | Positive | Negative | Unclassified |")
              print("| --- | --- | --- | ---: | ---: | ---: | ---: | ---: | ---: |")
              for endpoint in endpoints:
                  endpoint_cases = endpoint_test_cases.get(endpoint_key(endpoint), [])
                  smoke_count = suite_counts(endpoint_cases, "Smoke")
                  regression_count = suite_counts(endpoint_cases, "Regression")
                  endpoint_positive_count = sum(1 for test_case in endpoint_cases if classify_test_case(test_case) == "Positive")
                  endpoint_negative_count = sum(1 for test_case in endpoint_cases if classify_test_case(test_case) == "Negative")
                  endpoint_unclassified_count = len(endpoint_cases) - endpoint_positive_count - endpoint_negative_count
                  source_file = endpoint.get("sourceFile") or "(unknown source)"
                  source_line = endpoint.get("sourceLine")
                  source = f"{source_file}:{source_line}" if source_line is not None else source_file
                  print(
                      f"| {escape_cell(endpoint.get('httpMethod'))} | "
                      f"`{escape_cell(endpoint.get('route'))}` | "
                      f"`{escape_cell(source)}` | "
                      f"{len(endpoint_cases)} | {smoke_count} | {regression_count} | "
                      f"{endpoint_positive_count} | {endpoint_negative_count} | {endpoint_unclassified_count} |"
                  )
              print()
          else:
              print("### Generated testcase details")
              print()
              print(f"_Unavailable: {escape_cell(suite_error)}_")
              print()
              print("### Generated testcase counts")
              print()
              print("| Category | Count |")
              print("| --- | ---: |")
              print("| Endpoints detected | 0 |")
              print("| Total testcases | 0 |")
              print("| Smoke | 0 |")
              print("| Regression | 0 |")
              print("| Positive | 0 |")
              print("| Negative | 0 |")
              print("| Unclassified | 0 |")
              print()
              print("### Detected endpoints (0)")
              print()
              print("_Unavailable because the generated suite details could not be parsed._")
              print()

          print("### Inputs for `Run generated testcases`")
          print()
          print(f"- `test_suite_version_tag`: `{escape_cell(os.environ['VERSION_TAG'])}`")
          print()
          print("Generated suite version tags always end with `-<workflow-run-id>`, so `test_suite_version_tag` is enough for the run workflow.")
          PY
