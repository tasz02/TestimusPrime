name: Run regression suite

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: HTTP timeout for each generated request
        required: false
        default: "30"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-regression-suite:
    outputs:
      run_artifacts_ready: ${{ steps.mark_run_artifacts_ready.outputs.ready }}
    runs-on: ubuntu-latest
    env:
      SUITE_TRIGGER_EVENT: PullRequest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore /home/runner/work/TestimusPrime/TestimusPrime/TestimusPrime.slnx

      - name: Start sample API
        run: |
          dotnet run --project /home/runner/work/TestimusPrime/TestimusPrime/tests/TestimusPrime.Tests/Fixtures/SampleApi/SampleApi.csproj --urls http://127.0.0.1:5050 > /tmp/sample-api.log 2>&1 &
          echo $! > /tmp/sample-api.pid

      - name: Wait for sample API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5050/status > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Sample API did not become ready in time."
          cat /tmp/sample-api.log
          exit 1

      - name: Run regression suite
        id: run_regression_suite
        continue-on-error: true
        run: >
          dotnet run --project /home/runner/work/TestimusPrime/TestimusPrime/src/TestimusPrime.Runner --
          --repo=/home/runner/work/TestimusPrime/TestimusPrime/tests/TestimusPrime.Tests/Fixtures/SampleApi
          --api-base-url=http://127.0.0.1:5050
          --trigger=${{ env.SUITE_TRIGGER_EVENT }}
          --output=/home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/regression
          --timeout-seconds=${{ inputs.timeout_seconds }}

      - name: Upload regression suite artifacts
        id: upload_run_artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-suite-artifacts
          path: |
            /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/regression
            /tmp/sample-api.log

      - name: Mark run artifacts ready
        id: mark_run_artifacts_ready
        if: ${{ always() && steps.upload_run_artifacts.outcome == 'success' }}
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Summarize regression suite results
        if: always()
        run: |
          set -o pipefail
          python /home/runner/work/TestimusPrime/TestimusPrime/.github/scripts/summarize_test_run.py \
            --summary-title "Regression run summary" \
            --suite-name Regression \
            --api-base-url http://127.0.0.1:5050 \
            --trigger-event "${{ env.SUITE_TRIGGER_EVENT }}" \
            --timeout-seconds "${{ inputs.timeout_seconds }}" \
            --execution-step-outcome "${{ steps.run_regression_suite.outcome }}" \
            --report-directory /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/regression \
            --dashboard-url https://tasz02.github.io/TestimusPrime/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop sample API
        if: always()
        run: |
          if [ -f /tmp/sample-api.pid ]; then
            kill "$(cat /tmp/sample-api.pid)" || true
          fi

      - name: Fail workflow when regression tests fail
        if: always()
        env:
          REPORT_DIRECTORY: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/regression
          TEST_STEP_OUTCOME: ${{ steps.run_regression_suite.outcome }}
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import sys

          report_directory = pathlib.Path(os.environ["REPORT_DIRECTORY"])
          report_files = sorted(report_directory.glob("*.json"))
          if not report_files:
              print(f"No test report files were found in {report_directory}.")
              sys.exit(1)

          failed_tests = 0
          for report_file in report_files:
              with report_file.open() as handle:
                  report = json.load(handle)
              failed_tests += int(report.get("summary", {}).get("failed", 0))

          test_step_outcome = os.environ["TEST_STEP_OUTCOME"]
          if test_step_outcome != "success":
              print(f"Regression suite execution step finished with outcome: {test_step_outcome}.")
              sys.exit(1)

          if failed_tests > 0:
              print(f"Regression suite execution reported {failed_tests} failed test(s).")
              sys.exit(1)

          print("Regression suite execution completed with no failed tests.")
          PY

  publish-dashboard:
    needs: run-regression-suite
    if: ${{ always() && needs.run-regression-suite.outputs.run_artifacts_ready == 'true' }}
    concurrency:
      group: dashboard-pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download regression suite artifacts
        uses: actions/download-artifact@v8
        with:
          name: regression-suite-artifacts
          path: /home/runner/work/TestimusPrime/TestimusPrime/.dashboard-input

      - name: Prepare dashboard site history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pages_dir="/home/runner/work/TestimusPrime/TestimusPrime/.pages-current"
          rm -rf "${pages_dir}"
          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${pages_dir}"
          else
            mkdir -p "${pages_dir}"
          fi

      - name: Build static dashboard site
        run: |
          python /home/runner/work/TestimusPrime/TestimusPrime/.github/scripts/build_dashboard_site.py \
            --reports-directory /home/runner/work/TestimusPrime/TestimusPrime/.dashboard-input \
            --existing-site /home/runner/work/TestimusPrime/TestimusPrime/.pages-current \
            --output-site /tmp/testimusprime-pages-output \
            --assets-directory /home/runner/work/TestimusPrime/TestimusPrime/src/TestimusPrime.Dashboard/wwwroot \
            --history-limit 20

      - name: Publish dashboard site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_dir="/home/runner/work/TestimusPrime/TestimusPrime/.pages-current"
          if [ -d "${pages_dir}/.git" ]; then
            cd "${pages_dir}"
          else
            rm -rf "${pages_dir}"
            mkdir -p "${pages_dir}"
            cd "${pages_dir}"
            git init
            git checkout -B gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          rsync -a --delete --exclude='.git/' /tmp/testimusprime-pages-output/ "${pages_dir}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Dashboard site content is unchanged."
            exit 0
          fi

          git commit -m "Update dashboard site from regression suite ${GITHUB_RUN_ID}"
          git push origin HEAD:gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/testimusprime-pages-output

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
