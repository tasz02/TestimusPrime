name: Run smoke suite

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: HTTP timeout for each generated request
        required: false
        default: "30"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-smoke-suite:
    outputs:
      run_artifacts_ready: ${{ steps.mark_run_artifacts_ready.outputs.ready }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore /home/runner/work/TestimusPrime/TestimusPrime/TestimusPrime.slnx

      - name: Start sample API
        run: |
          dotnet run --project /home/runner/work/TestimusPrime/TestimusPrime/tests/TestimusPrime.Tests/Fixtures/SampleApi/SampleApi.csproj --urls http://127.0.0.1:5050 > /tmp/sample-api.log 2>&1 &
          echo $! > /tmp/sample-api.pid

      - name: Wait for sample API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5050/status > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Sample API did not become ready in time."
          cat /tmp/sample-api.log
          exit 1

      - name: Run smoke suite
        id: run_smoke_suite
        continue-on-error: true
        run: >
          dotnet run --project /home/runner/work/TestimusPrime/TestimusPrime/src/TestimusPrime.Runner --
          --repo=/home/runner/work/TestimusPrime/TestimusPrime/tests/TestimusPrime.Tests/Fixtures/SampleApi
          --api-base-url=http://127.0.0.1:5050
          --trigger=Commit
          --output=/home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/smoke
          --timeout-seconds=${{ inputs.timeout_seconds }}

      - name: Upload smoke suite artifacts
        id: upload_run_artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-suite-artifacts
          path: |
            /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/smoke
            /tmp/sample-api.log

      - name: Mark run artifacts ready
        id: mark_run_artifacts_ready
        if: ${{ always() && steps.upload_run_artifacts.outcome == 'success' }}
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Summarize smoke suite results
        if: always()
        env:
          REPORT_DIRECTORY: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/smoke
          TEST_STEP_OUTCOME: ${{ steps.run_smoke_suite.outcome }}
          TRIGGER_EVENT: Commit
          API_BASE_URL: http://127.0.0.1:5050
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          SUITE_NAME: Smoke
        run: |
          set -o pipefail
          python <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import pathlib
          from collections.abc import Mapping

          def escape_cell(value):
              text = "" if value is None else str(value)
              return text.replace("|", "\\|").replace("\n", "<br>")

          def as_int(value):
              try:
                  return max(int(value), 0)
              except (TypeError, ValueError):
                  return 0

          report_directory = pathlib.Path(os.environ["REPORT_DIRECTORY"])
          rows = []
          totals = {"total": 0, "passed": 0, "failed": 0}
          parse_errors = []
          if report_directory.is_dir():
              report_files = sorted(report_directory.glob("*.json"))
          else:
              report_files = []
              parse_errors.append(f"Report directory not found: {report_directory}")

          for report_file in report_files:
              try:
                  with report_file.open(encoding="utf-8") as handle:
                      report = json.load(handle)
              except Exception as exc:  # summary generation must remain best-effort
                  parse_errors.append(f"{report_file.name}: {exc}")
                  continue

              if not isinstance(report, Mapping):
                  parse_errors.append(f"{report_file.name}: expected a JSON object")
                  continue

              summary = report.get("summary") or {}
              if not isinstance(summary, Mapping):
                  summary = {}

              passed = as_int(summary.get("passed"))
              failed = as_int(summary.get("failed"))
              raw_total = summary.get("total")
              reported_total = as_int(raw_total)
              minimum_total = passed + failed
              total = reported_total if reported_total >= minimum_total else minimum_total
              if raw_total is not None and reported_total < minimum_total:
                  parse_errors.append(
                      f"{report_file.name}: summary total {reported_total} did not match passed + failed ({total}); using {total}."
                  )
              pass_rate_text = f"{(passed / total * 100):.2f}%" if total else "0.00%"
              totals["total"] += total
              totals["passed"] += passed
              totals["failed"] += failed
              rows.append(
                  {
                      "report": report_file.name,
                      "run_id": report.get("runId") or report_file.stem,
                      "trigger_event": report.get("triggerEvent") or os.environ["TRIGGER_EVENT"],
                      "completed_at": report.get("completedAt") or "",
                      "total": total,
                      "passed": passed,
                      "failed": failed,
                      "pass_rate": pass_rate_text,
                  }
              )

          overall_pass_rate = round((totals["passed"] / totals["total"] * 100), 2) if totals["total"] else 0
          print(f"## {os.environ['SUITE_NAME']} run summary")
          print()
          print("| Field | Value |")
          print("| --- | --- |")
          print(f"| Suite | `{escape_cell(os.environ['SUITE_NAME'])}` |")
          print(f"| API base URL | `{escape_cell(os.environ['API_BASE_URL'])}` |")
          print(f"| Trigger event | `{escape_cell(os.environ['TRIGGER_EVENT'])}` |")
          print(f"| Timeout seconds | `{escape_cell(os.environ['TIMEOUT_SECONDS'])}` |")
          print(f"| Execution step outcome | `{escape_cell(os.environ['TEST_STEP_OUTCOME'])}` |")
          print(f"| Report directory | `{escape_cell(report_directory)}` |")
          print(f"| Dashboard | [Open dashboard](https://tasz02.github.io/TestimusPrime/) |")
          print()
          print("### Summary totals")
          print()
          print("| Total tests | Passed | Failed | Pass rate | Reports |")
          print("| ---: | ---: | ---: | ---: | ---: |")
          print(f"| {totals['total']} | {totals['passed']} | {totals['failed']} | {overall_pass_rate:.2f}% | {len(rows)} |")
          print()
          print("### Test results")
          print()
          print("| Report | Run ID | Trigger | Completed | Total | Passed | Failed | Pass rate |")
          print("| --- | --- | --- | --- | ---: | ---: | ---: | ---: |")
          if rows:
              for row in rows:
                  print(
                      f"| `{escape_cell(row['report'])}` | "
                      f"`{escape_cell(row['run_id'])}` | "
                      f"`{escape_cell(row['trigger_event'])}` | "
                      f"`{escape_cell(row['completed_at'])}` | "
                      f"{row['total']} | {row['passed']} | {row['failed']} | {escape_cell(row['pass_rate'])} |"
                  )
          else:
              print("| _No parsed reports found_ |  |  |  | 0 | 0 | 0 | 0.00% |")
          print()

          if parse_errors:
              print("### Report parsing warnings")
              print()
              for error in parse_errors:
                  print(f"- {escape_cell(error)}")
              print()
          PY

      - name: Stop sample API
        if: always()
        run: |
          if [ -f /tmp/sample-api.pid ]; then
            kill "$(cat /tmp/sample-api.pid)" || true
          fi

      - name: Fail workflow when smoke tests fail
        if: always()
        env:
          REPORT_DIRECTORY: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/smoke
          TEST_STEP_OUTCOME: ${{ steps.run_smoke_suite.outcome }}
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import sys

          report_directory = pathlib.Path(os.environ["REPORT_DIRECTORY"])
          report_files = sorted(report_directory.glob("*.json"))
          if not report_files:
              print(f"No test report files were found in {report_directory}.")
              sys.exit(1)

          failed_tests = 0
          for report_file in report_files:
              with report_file.open() as handle:
                  report = json.load(handle)
              failed_tests += int(report.get("summary", {}).get("failed", 0))

          test_step_outcome = os.environ["TEST_STEP_OUTCOME"]
          if test_step_outcome != "success":
              print(f"Smoke suite execution step finished with outcome: {test_step_outcome}.")
              sys.exit(1)

          if failed_tests > 0:
              print(f"Smoke suite execution reported {failed_tests} failed test(s).")
              sys.exit(1)

          print("Smoke suite execution completed with no failed tests.")
          PY

  publish-dashboard:
    needs: run-smoke-suite
    if: ${{ always() && needs.run-smoke-suite.outputs.run_artifacts_ready == 'true' }}
    concurrency:
      group: dashboard-pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download smoke suite artifacts
        uses: actions/download-artifact@v8
        with:
          name: smoke-suite-artifacts
          path: /home/runner/work/TestimusPrime/TestimusPrime/.dashboard-input

      - name: Prepare dashboard site history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pages_dir="/home/runner/work/TestimusPrime/TestimusPrime/.pages-current"
          rm -rf "${pages_dir}"
          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${pages_dir}"
          else
            mkdir -p "${pages_dir}"
          fi

      - name: Build static dashboard site
        run: |
          python /home/runner/work/TestimusPrime/TestimusPrime/.github/scripts/build_dashboard_site.py \
            --reports-directory /home/runner/work/TestimusPrime/TestimusPrime/.dashboard-input \
            --existing-site /home/runner/work/TestimusPrime/TestimusPrime/.pages-current \
            --output-site /tmp/testimusprime-pages-output \
            --assets-directory /home/runner/work/TestimusPrime/TestimusPrime/src/TestimusPrime.Dashboard/wwwroot \
            --history-limit 20

      - name: Publish dashboard site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_dir="/home/runner/work/TestimusPrime/TestimusPrime/.pages-current"
          if [ -d "${pages_dir}/.git" ]; then
            cd "${pages_dir}"
          else
            rm -rf "${pages_dir}"
            mkdir -p "${pages_dir}"
            cd "${pages_dir}"
            git init
            git checkout -B gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          rsync -a --delete --exclude='.git/' /tmp/testimusprime-pages-output/ "${pages_dir}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Dashboard site content is unchanged."
            exit 0
          fi

          git commit -m "Update dashboard site from smoke suite ${GITHUB_RUN_ID}"
          git push origin HEAD:gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/testimusprime-pages-output

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
