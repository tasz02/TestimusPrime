name: Run generated testcases

on:
  workflow_dispatch:
    inputs:
      generation_run_id:
        description: Optional workflow run ID override for custom version tags that do not end with the generating run ID
        required: false
        default: ""
      test_suite_version_tag:
        description: Version tag of the generated testcase suite to execute
        required: true
      api_base_url:
        description: Absolute base URL of the API to test
        required: true
      trigger_event:
        description: Suite selection to execute
        required: false
        default: Commit
        type: choice
        options:
          - Commit
          - PullRequest
      timeout_seconds:
        description: HTTP timeout for each generated request
        required: false
        default: "30"

permissions:
  actions: read
  contents: read

jobs:
  run-generated-testcases:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve generated testcase artifact
        id: resolve_suite
        env:
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
          VERSION_TAG: ${{ inputs.test_suite_version_tag }}
        run: |
          python <<'PY'
          import os
          import re
          import sys

          generation_run_id = os.environ["GENERATION_RUN_ID"].strip()
          version_tag = os.environ["VERSION_TAG"]
          artifact_name = f"generated-testcases-{version_tag}"

          if generation_run_id:
              if not generation_run_id.isdigit():
                  print("The optional generation_run_id input must be a numeric workflow run ID.")
                  sys.exit(1)
              run_id = generation_run_id
          else:
              match = re.fullmatch(r"testcases-v\d{17}-(\d+)", version_tag)
              if not match:
                  print(
                      "The test_suite_version_tag does not end with an embedded workflow run ID. "
                      "Provide generation_run_id when using a custom version tag."
                  )
                  sys.exit(1)
              run_id = match.group(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_name={artifact_name}\n")
              output.write(f"generation_run_id={run_id}\n")
          PY

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore /home/runner/work/TestimusPrime/TestimusPrime/TestimusPrime.slnx

      - name: Download generated testcase artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.resolve_suite.outputs.artifact_name }}
          path: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/generated-testcases/${{ inputs.test_suite_version_tag }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve_suite.outputs.generation_run_id }}

      - name: Run saved testcase suite
        id: run_saved_testcase_suite
        continue-on-error: true
        run: >
          dotnet run --project /home/runner/work/TestimusPrime/TestimusPrime/src/TestimusPrime.Runner --
          --mode=ExecuteGenerated
          --test-suite=/home/runner/work/TestimusPrime/TestimusPrime/artifacts/generated-testcases/${{ inputs.test_suite_version_tag }}/${{ inputs.test_suite_version_tag }}.json
          --api-base-url=${{ inputs.api_base_url }}
          --trigger=${{ inputs.trigger_event }}
          --output=/home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/generated/${{ inputs.test_suite_version_tag }}
          --timeout-seconds=${{ inputs.timeout_seconds }}

      - name: Upload generated-suite run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-suite-run-${{ inputs.test_suite_version_tag }}
          path: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/generated/${{ inputs.test_suite_version_tag }}

      - name: Fail workflow when generated tests fail
        if: always()
        env:
          REPORT_DIRECTORY: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/generated/${{ inputs.test_suite_version_tag }}
          TEST_STEP_OUTCOME: ${{ steps.run_saved_testcase_suite.outcome }}
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import sys

          report_directory = pathlib.Path(os.environ["REPORT_DIRECTORY"])
          report_files = sorted(report_directory.glob("*.json"))
          if not report_files:
              print(f"No test report files were found in {report_directory}.")
              sys.exit(1)

          failed_tests = 0
          for report_file in report_files:
              with report_file.open() as handle:
                  report = json.load(handle)
              failed_tests += int(report.get("summary", {}).get("failed", 0))

          test_step_outcome = os.environ["TEST_STEP_OUTCOME"]
          if test_step_outcome != "success":
              print(f"Generated testcase execution step finished with outcome: {test_step_outcome}.")
              sys.exit(1)

          if failed_tests > 0:
              print(f"Generated testcase execution reported {failed_tests} failed test(s).")
              sys.exit(1)

          print("Generated testcase execution completed with no failed tests.")
          PY
