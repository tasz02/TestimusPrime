name: Run generated testcases

on:
  workflow_dispatch:
    inputs:
      test_suite_version_tag:
        description: Version tag of the generated testcase suite to execute
        required: true
      api_base_url:
        description: Absolute base URL of the API to test
        required: true
      trigger_event:
        description: Suite selection to execute
        required: false
        default: Commit
        type: choice
        options:
          - Commit
          - PullRequest
      timeout_seconds:
        description: HTTP timeout for each generated request
        required: false
        default: "30"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  run-generated-testcases:
    outputs:
      run_artifacts_ready: ${{ steps.mark_run_artifacts_ready.outputs.ready }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve generated testcase artifact
        id: resolve_suite
        env:
          VERSION_TAG: ${{ inputs.test_suite_version_tag }}
        run: |
          set -euo pipefail
          version_tag="${VERSION_TAG}"
          artifact_name="generated-testcases-${version_tag}"
          run_id="$(python "${GITHUB_WORKSPACE}/.github/scripts/generated_suite_version.py" extract-run-id --version-tag "$version_tag")"

          {
            echo "artifact_name=${artifact_name}"
            echo "generation_run_id=${run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore /home/runner/work/TestimusPrime/TestimusPrime/TestimusPrime.slnx

      - name: Download generated testcase artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.resolve_suite.outputs.artifact_name }}
          path: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/generated-testcases/${{ inputs.test_suite_version_tag }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve_suite.outputs.generation_run_id }}

      - name: Resolve local sample API bootstrap
        id: sample_api
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          SUITE_FILE: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/generated-testcases/${{ inputs.test_suite_version_tag }}/${{ inputs.test_suite_version_tag }}.json
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          suite_file = Path(os.environ["SUITE_FILE"]).resolve()
          sample_api_path = (workspace / "tests" / "TestimusPrime.Tests" / "Fixtures" / "SampleApi").resolve()
          sample_api_project = sample_api_path / "SampleApi.csproj"

          with suite_file.open() as handle:
              suite = json.load(handle)

          repository_path = Path(suite["repositoryPath"]).resolve()
          parsed_base_url = urlparse(os.environ["API_BASE_URL"])
          is_localhost = parsed_base_url.hostname in {"127.0.0.1", "localhost"} and parsed_base_url.scheme in {"http", "https"}
          should_start = is_localhost and repository_path == sample_api_path and sample_api_project.is_file()
          readiness_url = f"{os.environ['API_BASE_URL'].rstrip('/')}/status"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"should_start={'true' if should_start else 'false'}\n")
              output.write(f"readiness_url={readiness_url}\n")
              if should_start:
                  output.write(f"project_path={sample_api_project}\n")
          PY

      - name: Start sample API
        if: ${{ steps.sample_api.outputs.should_start == 'true' }}
        run: |
          dotnet run --project "${{ steps.sample_api.outputs.project_path }}" --urls ${{ inputs.api_base_url }} > /tmp/sample-api.log 2>&1 &
          echo $! > /tmp/sample-api.pid

      - name: Wait for sample API
        if: ${{ steps.sample_api.outputs.should_start == 'true' }}
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "${{ steps.sample_api.outputs.readiness_url }}" > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "Sample API did not become ready in time."
          cat /tmp/sample-api.log
          exit 1

      - name: Run saved testcase suite
        id: run_saved_testcase_suite
        continue-on-error: true
        run: >
          dotnet run --project /home/runner/work/TestimusPrime/TestimusPrime/src/TestimusPrime.Runner --
          --mode=ExecuteGenerated
          --test-suite=/home/runner/work/TestimusPrime/TestimusPrime/artifacts/generated-testcases/${{ inputs.test_suite_version_tag }}/${{ inputs.test_suite_version_tag }}.json
          --api-base-url=${{ inputs.api_base_url }}
          --trigger=${{ inputs.trigger_event }}
          --output=/home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/generated/${{ inputs.test_suite_version_tag }}
          --timeout-seconds=${{ inputs.timeout_seconds }}

      - name: Stop sample API
        if: always() && steps.sample_api.outputs.should_start == 'true'
        run: |
          if [ -f /tmp/sample-api.pid ]; then
            kill "$(cat /tmp/sample-api.pid)" || true
          fi

      - name: Upload generated-suite run artifacts
        id: upload_run_artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-suite-run-${{ inputs.test_suite_version_tag }}
          path: |
            /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/generated/${{ inputs.test_suite_version_tag }}
            /tmp/sample-api.log

      - name: Mark run artifacts ready
        id: mark_run_artifacts_ready
        if: ${{ always() && steps.upload_run_artifacts.outcome == 'success' }}
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Summarize generated testcase results
        if: always()
        run: |
          set -o pipefail
          python /home/runner/work/TestimusPrime/TestimusPrime/.github/scripts/summarize_test_run.py \
            --summary-title "Generated testcase run summary" \
            --version-tag "${{ inputs.test_suite_version_tag }}" \
            --api-base-url "${{ inputs.api_base_url }}" \
            --trigger-event "${{ inputs.trigger_event }}" \
            --execution-step-outcome "${{ steps.run_saved_testcase_suite.outcome }}" \
            --report-directory /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/generated/${{ inputs.test_suite_version_tag }} \
            --dashboard-url https://tasz02.github.io/TestimusPrime/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow when generated tests fail
        if: always()
        env:
          REPORT_DIRECTORY: /home/runner/work/TestimusPrime/TestimusPrime/artifacts/testruns/generated/${{ inputs.test_suite_version_tag }}
          TEST_STEP_OUTCOME: ${{ steps.run_saved_testcase_suite.outcome }}
        run: |
          python <<'PY'
          import json
          import os
          import pathlib
          import sys

          report_directory = pathlib.Path(os.environ["REPORT_DIRECTORY"])
          report_files = sorted(report_directory.glob("*.json"))
          if not report_files:
              print(f"No test report files were found in {report_directory}.")
              sys.exit(1)

          failed_tests = 0
          for report_file in report_files:
              with report_file.open() as handle:
                  report = json.load(handle)
              failed_tests += int(report.get("summary", {}).get("failed", 0))

          test_step_outcome = os.environ["TEST_STEP_OUTCOME"]
          if test_step_outcome != "success":
              print(f"Generated testcase execution step finished with outcome: {test_step_outcome}.")
              sys.exit(1)

          if failed_tests > 0:
              print(f"Generated testcase execution reported {failed_tests} failed test(s).")
              sys.exit(1)

          print("Generated testcase execution completed with no failed tests.")
          PY

  publish-dashboard:
    needs: run-generated-testcases
    if: ${{ always() && needs.run-generated-testcases.outputs.run_artifacts_ready == 'true' }}
    concurrency:
      group: dashboard-pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download generated-suite run artifacts
        uses: actions/download-artifact@v8
        with:
          name: generated-suite-run-${{ inputs.test_suite_version_tag }}
          path: /home/runner/work/TestimusPrime/TestimusPrime/.dashboard-input

      - name: Prepare dashboard site history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pages_dir="/home/runner/work/TestimusPrime/TestimusPrime/.pages-current"
          rm -rf "${pages_dir}"
          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${pages_dir}"
          else
            mkdir -p "${pages_dir}"
          fi

      - name: Build static dashboard site
        run: |
          python /home/runner/work/TestimusPrime/TestimusPrime/.github/scripts/build_dashboard_site.py \
            --reports-directory /home/runner/work/TestimusPrime/TestimusPrime/.dashboard-input \
            --existing-site /home/runner/work/TestimusPrime/TestimusPrime/.pages-current \
            --output-site /tmp/testimusprime-pages-output \
            --assets-directory /home/runner/work/TestimusPrime/TestimusPrime/src/TestimusPrime.Dashboard/wwwroot \
            --history-limit 20

      - name: Publish dashboard site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_dir="/home/runner/work/TestimusPrime/TestimusPrime/.pages-current"
          if [ -d "${pages_dir}/.git" ]; then
            cd "${pages_dir}"
          else
            rm -rf "${pages_dir}"
            mkdir -p "${pages_dir}"
            cd "${pages_dir}"
            git init
            git checkout -B gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          rsync -a --delete --exclude='.git/' /tmp/testimusprime-pages-output/ "${pages_dir}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Dashboard site content is unchanged."
            exit 0
          fi

          git commit -m "Update dashboard site from generated suite ${GITHUB_RUN_ID}"
          git push origin HEAD:gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/testimusprime-pages-output

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
