<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestimusPrime Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card, details, .error { background: #1e293b; border-radius: 12px; padding: 1rem; border: 1px solid #334155; }
        h1, h2 { margin-top: 0; }
        .run { margin-bottom: 1rem; }
        .error { border-color: #ef4444; color: #fecaca; margin-bottom: 1rem; }
        .source { color: #94a3b8; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #334155; vertical-align: top; }
        .passed { color: #4ade80; }
        .failed { color: #f87171; }
        code { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <h1>TestimusPrime Dashboard</h1>
    <div id="error"></div>
    <div id="source" class="source"></div>
    <div id="metrics" class="metrics"></div>
    <h2>Recent runs</h2>
    <div id="runs"></div>
    <h2>All testcases</h2>
    <div id="testcases"></div>
    <script>
        const errorBox = document.getElementById('error');
        const sourceBox = document.getElementById('source');
        const metrics = document.getElementById('metrics');
        const runs = document.getElementById('runs');
        const testcases = document.getElementById('testcases');
        const triggerLabels = { 0: 'Commit', 1: 'PullRequest', Commit: 'Commit', PullRequest: 'PullRequest' };
        const suiteLabels = { 0: 'Smoke', 1: 'Regression', Smoke: 'Smoke', Regression: 'Regression' };
        const sources = [
            { label: 'live API', summaryUrl: 'api/summary', runsUrl: 'api/runs' },
            { label: 'published history', summaryUrl: 'data/summary.json', runsUrl: 'data/runs.json' }
        ];

        const appendMetric = (label, value) => {
            const card = document.createElement('div');
            card.className = 'card';
            const strong = document.createElement('strong');
            strong.textContent = label;
            const content = document.createElement('div');
            content.textContent = value;
            card.append(strong, content);
            metrics.appendChild(card);
        };

        const createCodeBlock = text => {
            const code = document.createElement('code');
            code.textContent = text;
            return code;
        };

        const createCell = content => {
            const cell = document.createElement('td');
            if (typeof content === 'string') {
                cell.textContent = content;
            } else {
                cell.appendChild(content);
            }
            return cell;
        };

        const statusClass = passed => passed ? 'passed' : 'failed';
        const formatTrigger = trigger => triggerLabels[trigger] ?? String(trigger ?? 'Unknown');
        const formatSuites = suites => (Array.isArray(suites) ? suites.map(suite => suiteLabels[suite] ?? String(suite)) : []).join(', ');
        const formatPassRate = (passed, total) => `${total === 0 ? 0 : Math.round((passed / total) * 10000) / 100}%`;
        const parseTimestamp = value => {
            const timestamp = Date.parse(value ?? '');
            return Number.isNaN(timestamp) ? null : timestamp;
        };
        const formatDateTime = value => {
            const timestamp = parseTimestamp(value);
            return timestamp === null ? 'Unknown' : new Date(timestamp).toLocaleString();
        };

        function buildTestcaseHistory(reports) {
            const history = new Map();

            reports.forEach(report => {
                report.results.forEach(result => {
                    const existing = history.get(result.testCaseId);
                    if (existing) {
                        existing.totalRuns += 1;
                        existing.passed += result.passed ? 1 : 0;
                        existing.failed += result.passed ? 0 : 1;
                        const reportTimestamp = parseTimestamp(report.completedAt);
                        const existingTimestamp = parseTimestamp(existing.latestCompletedAt);
                        if (reportTimestamp !== null && (existingTimestamp === null || reportTimestamp > existingTimestamp)) {
                            existing.latestPassed = result.passed;
                            existing.latestOutcome = result.outcome;
                            existing.latestCompletedAt = report.completedAt;
                        }
                    } else {
                        history.set(result.testCaseId, {
                            testCaseId: result.testCaseId,
                            testName: result.testName,
                            suites: result.suites,
                            totalRuns: 1,
                            passed: result.passed ? 1 : 0,
                            failed: result.passed ? 0 : 1,
                            latestPassed: result.passed,
                            latestOutcome: result.outcome,
                            latestCompletedAt: report.completedAt
                        });
                    }
                });
            });

            return Array.from(history.values())
                .sort((left, right) => (left.testName ?? left.testCaseId ?? '').localeCompare(right.testName ?? right.testCaseId ?? ''));
        }

        function renderTestcases(reports) {
            testcases.replaceChildren();
            const history = buildTestcaseHistory(reports);

            if (history.length === 0) {
                const empty = document.createElement('p');
                empty.textContent = 'No testcase history available.';
                testcases.appendChild(empty);
                return;
            }

            const table = document.createElement('table');
            const headerRow = document.createElement('tr');
            ['Testcase', 'Runs', 'Passed', 'Failed', 'Pass rate', 'Latest outcome', 'Latest run'].forEach(label => {
                const header = document.createElement('th');
                header.textContent = label;
                headerRow.appendChild(header);
            });

            const thead = document.createElement('thead');
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            history.forEach(entry => {
                const row = document.createElement('tr');

                const testCell = document.createElement('td');
                testCell.append(document.createTextNode(entry.testName ?? entry.testCaseId ?? 'Unnamed testcase'));
                testCell.appendChild(document.createElement('br'));
                const suites = document.createElement('small');
                suites.textContent = formatSuites(entry.suites);
                testCell.appendChild(suites);

                const latestOutcome = document.createElement('span');
                latestOutcome.className = statusClass(entry.latestPassed);
                latestOutcome.textContent = entry.latestOutcome;

                row.append(
                    testCell,
                    createCell(String(entry.totalRuns)),
                    createCell(String(entry.passed)),
                    createCell(String(entry.failed)),
                    createCell(formatPassRate(entry.passed, entry.totalRuns)),
                    createCell(latestOutcome),
                    createCell(formatDateTime(entry.latestCompletedAt))
                );

                tbody.appendChild(row);
            });

            table.appendChild(tbody);
            testcases.appendChild(table);
        }

        async function getJson(url) {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`${url} returned ${response.status}`);
            }

            return response.json();
        }

        function render(summary, reports, sourceLabel) {
            errorBox.className = '';
            errorBox.textContent = '';
            sourceBox.textContent = `Showing data from ${sourceLabel}.`;
            metrics.replaceChildren();
            appendMetric('Runs', String(summary.totalRuns));
            appendMetric('Tests', String(summary.totalTests));
            appendMetric('Passed', String(summary.passedTests));
            appendMetric('Failed', String(summary.failedTests));
            appendMetric('Average pass rate', `${summary.averagePassRate}%`);

            runs.replaceChildren();
            reports.forEach(report => {
                const details = document.createElement('details');
                details.className = 'run';

                const summaryElement = document.createElement('summary');
                const summaryStatus = document.createElement('span');
                summaryStatus.className = statusClass(report.summary.failed === 0);
                summaryStatus.textContent = `${report.summary.passRate}%`;
                summaryElement.append(`${report.runId} · ${formatTrigger(report.triggerEvent)} · `, summaryStatus);

                const completed = document.createElement('p');
                completed.textContent = `Completed: ${new Date(report.completedAt).toLocaleString()}`;

                const stats = document.createElement('p');
                stats.textContent = `Analyzed endpoints: ${report.analysis.endpoints.length} · Executed tests: ${report.summary.total}`;

                const table = document.createElement('table');
                const headerRow = document.createElement('tr');
                ['Test', 'Status', 'Request', 'Response'].forEach(label => {
                    const header = document.createElement('th');
                    header.textContent = label;
                    headerRow.appendChild(header);
                });
                const thead = document.createElement('thead');
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                report.results.forEach(result => {
                    const row = document.createElement('tr');

                    const testCell = document.createElement('td');
                    testCell.append(document.createTextNode(result.testName));
                    testCell.appendChild(document.createElement('br'));
                    const suites = document.createElement('small');
                    suites.textContent = formatSuites(result.suites);
                    testCell.appendChild(suites);

                    const statusCell = document.createElement('td');
                    statusCell.className = statusClass(result.passed);
                    statusCell.textContent = result.outcome;

                    const requestText = `${result.request.method} ${result.request.url}\n${result.request.body ?? ''}`;
                    const responseText = `Status: ${result.response.statusCode ?? 'error'}\n${result.response.body ?? result.response.error ?? ''}`;

                    row.append(testCell, statusCell, createCell(createCodeBlock(requestText)), createCell(createCodeBlock(responseText)));
                    tbody.appendChild(row);
                });

                table.appendChild(tbody);
                details.append(summaryElement, completed, stats, table);
                runs.appendChild(details);
            });

            renderTestcases(reports);
        }

        async function load() {
            let lastError = null;

            for (const source of sources) {
                try {
                    const [summary, reports] = await Promise.all([
                        getJson(source.summaryUrl),
                        getJson(source.runsUrl)
                    ]);

                    render(summary, reports, source.label);
                    return;
                } catch (error) {
                    lastError = error;
                }
            }

            metrics.replaceChildren();
            runs.replaceChildren();
            testcases.replaceChildren();
            sourceBox.textContent = '';
            errorBox.className = 'error';
            errorBox.textContent = lastError instanceof Error ? lastError.message : 'Dashboard failed to load.';
        }

        load();
    </script>
</body>
</html>
