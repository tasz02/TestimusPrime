<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestimusPrime Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card, details, .error { background: #1e293b; border-radius: 12px; padding: 1rem; border: 1px solid #334155; }
        .chart-card { margin-bottom: 2rem; overflow-x: auto; max-width: 960px; }
        .chart-card svg { display: block; width: 100%; height: auto; }
        .chart-legend { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; margin: 1rem 0 0; padding: 0; list-style: none; font-size: 0.9rem; color: #cbd5e1; }
        .chart-legend-item { display: inline-flex; align-items: center; gap: 0.5rem; }
        .chart-swatch { width: 1.75rem; height: 0; border-top-width: 3px; border-top-style: solid; }
        .chart-swatch-dashed { border-top-style: dashed; }
        .chart-description { color: #cbd5e1; margin: 0 0 1rem; }
        .chart-empty { color: #94a3b8; margin: 0; }
        .chart-table { margin-top: 1rem; }
        h1, h2 { margin-top: 0; }
        .run { margin-bottom: 1rem; }
        .error { border-color: #ef4444; color: #fecaca; margin-bottom: 1rem; }
        .source { color: #94a3b8; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        caption { caption-side: top; text-align: left; color: #cbd5e1; font-weight: 600; padding-bottom: 0.75rem; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #334155; vertical-align: top; }
        .passed { color: #4ade80; }
        .failed { color: #f87171; }
        code { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <h1>TestimusPrime Dashboard</h1>
    <div id="error"></div>
    <div id="source" class="source"></div>
    <div id="metrics" class="metrics"></div>
    <h2 id="history-heading">History</h2>
    <div id="history-chart" class="card chart-card"></div>
    <h2>Recent runs</h2>
    <div id="runs"></div>
    <h2>All testcases</h2>
    <div id="testcases"></div>
    <script>
        const errorBox = document.getElementById('error');
        const sourceBox = document.getElementById('source');
        const metrics = document.getElementById('metrics');
        const historyChart = document.getElementById('history-chart');
        const runs = document.getElementById('runs');
        const testcases = document.getElementById('testcases');
        const svgNamespace = 'http://www.w3.org/2000/svg';
        const triggerLabels = { 0: 'Commit', 1: 'PullRequest', Commit: 'Commit', PullRequest: 'PullRequest' };
        const suiteLabels = { 0: 'Smoke', 1: 'Regression', Smoke: 'Smoke', Regression: 'Regression' };
        const sources = [
            { label: 'live API', summaryUrl: 'api/summary', runsUrl: 'api/runs' },
            { label: 'published history', summaryUrl: 'data/summary.json', runsUrl: 'data/runs.json' }
        ];

        const appendMetric = (label, value) => {
            const card = document.createElement('div');
            card.className = 'card';
            const strong = document.createElement('strong');
            strong.textContent = label;
            const content = document.createElement('div');
            content.textContent = value;
            card.append(strong, content);
            metrics.appendChild(card);
        };

        const createCodeBlock = text => {
            const code = document.createElement('code');
            code.textContent = text;
            return code;
        };

        const createSvgElement = (name, attributes = {}) => {
            const element = document.createElementNS(svgNamespace, name);
            Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, String(value)));
            return element;
        };

        const renderHistoryEmptyState = message => {
            const empty = document.createElement('p');
            empty.id = 'history-chart-description';
            empty.className = 'chart-empty';
            empty.textContent = message;
            historyChart.appendChild(empty);
        };

        const createCell = content => {
            const cell = document.createElement('td');
            if (typeof content === 'string') {
                cell.textContent = content;
            } else {
                cell.appendChild(content);
            }
            return cell;
        };

        const statusClass = passed => passed ? 'passed' : 'failed';
        const formatTrigger = trigger => triggerLabels[trigger] ?? String(trigger ?? 'Unknown');
        const formatSuite = suite => suiteLabels[suite] ?? String(suite ?? 'Unknown');
        const formatSuites = suites => (Array.isArray(suites) ? suites.map(suite => suiteLabels[suite] ?? String(suite)) : []).join(', ');
        const formatHistoryDate = value => new Date(value).toLocaleString([], { timeZone: 'UTC', timeZoneName: 'short' });
        const formatHistoryAxisDateParts = value => {
            const timestamp = new Date(value);
            return [
                timestamp.toLocaleDateString([], { month: 'short', day: 'numeric', timeZone: 'UTC' }),
                timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' })
            ];
        };
        const seriesPalette = {
            smoke: { passed: '#f97316', failed: '#ef4444' },
            regression: { passed: '#3b82f6', failed: '#a855f7' }
        };
        const getSeriesColors = (suiteName, index) => {
            const paletteKey = String(suiteName ?? '').toLowerCase();
            const palette = seriesPalette[paletteKey];
            if (palette) {
                return palette;
            }

            return {
                passed: `hsl(${(index * 137) % 360} 75% 64%)`,
                failed: `hsl(${(index * 137) % 360} 75% 52%)`
            };
        };
        const formatPassRate = (passed, total) => `${total === 0 ? 0 : Math.round((passed / total) * 10000) / 100}%`;
        const getTestcaseKey = (report, result, resultIndex) => result.testCaseId
            ?? ([
                result.testName,
                formatSuites(result.suites),
                result.request?.method,
                result.request?.url,
                result.request?.body
            ].filter(value => typeof value === 'string' && value.length > 0).join('|')
                || `anonymous:${report.runId ?? 'run'}:${resultIndex}`);
        const parseTimestamp = value => {
            const timestamp = Date.parse(value ?? '');
            return Number.isNaN(timestamp) ? null : timestamp;
        };
        const formatDateTime = value => {
            const timestamp = parseTimestamp(value);
            return timestamp === null ? 'Unknown' : new Date(timestamp).toLocaleString();
        };

        function renderHistoryChart(reports) {
            historyChart.replaceChildren();

            const orderedReports = reports
                .filter(report => report?.completedAt && !Number.isNaN(new Date(report.completedAt).valueOf()))
                .slice()
                .sort((left, right) => new Date(left.completedAt) - new Date(right.completedAt));

            const suiteNames = [...new Set(orderedReports.flatMap(report =>
                Array.isArray(report?.summary?.suites)
                    ? report.summary.suites.map(suiteSummary => formatSuite(suiteSummary?.suite))
                    : []))];

            if (orderedReports.length === 0 || suiteNames.length === 0) {
                renderHistoryEmptyState('No suite history available yet.');
                return;
            }

            const series = suiteNames.flatMap((suiteName, index) => {
                const colors = getSeriesColors(suiteName, index);
                const points = orderedReports
                    .map(report => {
                        const suiteSummary = Array.isArray(report?.summary?.suites)
                            ? report.summary.suites.find(candidate => formatSuite(candidate?.suite) === suiteName)
                            : null;
                        if (!suiteSummary) {
                            return null;
                        }

                        const completedAt = new Date(report.completedAt);
                        if (Number.isNaN(completedAt.valueOf())) {
                            return null;
                        }

                        return {
                            report,
                            completedAt,
                            passed: Number(suiteSummary.passed) || 0,
                            failed: Number(suiteSummary.failed) || 0
                        };
                    })
                    .filter(point => point !== null);

                return [
                    { label: `${suiteName} Passed`, color: colors.passed, dashed: false, points: points.map(point => ({ ...point, value: point.passed })) },
                    { label: `${suiteName} Failed`, color: colors.failed, dashed: true, points: points.map(point => ({ ...point, value: point.failed })) }
                ];
            }).filter(seriesEntry => seriesEntry.points.length > 0);

            if (series.length === 0) {
                renderHistoryEmptyState('No suite history available yet.');
                return;
            }

            const plottedTimestamps = [...new Set(series
                .flatMap(seriesEntry => seriesEntry.points.map(point => point.completedAt.valueOf())))]
                .sort((left, right) => left - right);
            if (plottedTimestamps.length === 0) {
                renderHistoryEmptyState('No suite history available yet.');
                return;
            }
            const timestampIndexes = new Map(plottedTimestamps.map((timestamp, index) => [timestamp, index]));
            const minTime = plottedTimestamps[0];
            const maxTime = plottedTimestamps[plottedTimestamps.length - 1];
            const maxValue = Math.max(1, ...series.flatMap(seriesEntry => seriesEntry.points.map(point => point.value)));
            const yTickCount = 4;
            const yStep = Math.max(1, Math.ceil(maxValue / yTickCount));
            const yMax = yStep * yTickCount;
            const measuredChartWidth = historyChart.getBoundingClientRect().width
                || historyChart.parentElement?.getBoundingClientRect().width
                || Math.max(280, (window.innerWidth || 0) - 64);
            const width = Math.min(820, Math.max(280, measuredChartWidth - 32));
            const height = width < 520 ? 240 : 260;
            const margin = { top: 24, right: 24, bottom: 70, left: 60 };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;
            const hasSingleTimestamp = minTime === maxTime;
            const timeSpan = Math.max(maxTime - minTime, 1);
            const xPosition = timestamp => hasSingleTimestamp
                ? margin.left + (chartWidth / 2)
                : margin.left + (((timestamp - minTime) / timeSpan) * chartWidth);
            const yPosition = value => margin.top + chartHeight - ((value / yMax) * chartHeight);
            const maxSeriesSpread = 30;
            const maxSeriesOffsetStep = 10;
            const overlappingPoints = new Map();
            const pointOffsets = new Map();
            series.forEach((seriesEntry, seriesIndex) => {
                seriesEntry.points.forEach((point, pointIndex) => {
                    const overlapKey = `${point.completedAt.valueOf()}:${point.value}`;
                    if (!overlappingPoints.has(overlapKey)) {
                        overlappingPoints.set(overlapKey, []);
                    }

                    overlappingPoints.get(overlapKey).push({ seriesIndex, pointIndex });
                });
            });
            overlappingPoints.forEach(group => {
                if (group.length < 2) {
                    return;
                }

                const groupOffsetStep = Math.min(maxSeriesOffsetStep, maxSeriesSpread / (group.length - 1));
                const groupCenter = (group.length - 1) / 2;
                const orderedGroup = group
                    .slice()
                    .sort((left, right) => left.seriesIndex - right.seriesIndex || left.pointIndex - right.pointIndex);
                const baseTimestamp = series[orderedGroup[0].seriesIndex].points[orderedGroup[0].pointIndex].completedAt.valueOf();
                const timestampIndex = timestampIndexes.get(baseTimestamp) ?? 0;
                const baseX = xPosition(baseTimestamp);
                const edgeTimestampSpread = 18;
                const previousTimestamp = timestampIndex > 0 ? plottedTimestamps[timestampIndex - 1] : null;
                const nextTimestamp = timestampIndex < plottedTimestamps.length - 1 ? plottedTimestamps[timestampIndex + 1] : null;
                const leftBoundary = hasSingleTimestamp
                    ? baseX - (edgeTimestampSpread / 2)
                    : previousTimestamp === null ? baseX - (edgeTimestampSpread / 2) : (xPosition(previousTimestamp) + baseX) / 2;
                const rightBoundary = hasSingleTimestamp
                    ? baseX + (edgeTimestampSpread / 2)
                    : nextTimestamp === null ? baseX + (edgeTimestampSpread / 2) : (baseX + xPosition(nextTimestamp)) / 2;
                const rawOffsets = orderedGroup.map((entry, entryIndex) => ({ entry, offset: (entryIndex - groupCenter) * groupOffsetStep }));
                const maxLeftOffset = Math.abs(Math.min(0, ...rawOffsets.map(item => item.offset)));
                const maxRightOffset = Math.max(0, ...rawOffsets.map(item => item.offset));
                const leftScale = maxLeftOffset === 0 ? 1 : (baseX - leftBoundary) / maxLeftOffset;
                const rightScale = maxRightOffset === 0 ? 1 : (rightBoundary - baseX) / maxRightOffset;
                const offsetScale = Math.max(0, Math.min(1, leftScale, rightScale));
                rawOffsets.forEach(({ entry, offset }) => {
                    pointOffsets.set(`${entry.seriesIndex}:${entry.pointIndex}`, offset * offsetScale);
                });
            });
            const getPointOffset = (seriesIndex, pointIndex) => pointOffsets.get(`${seriesIndex}:${pointIndex}`) ?? 0;
            const pointXPosition = (timestamp, seriesOffset = 0) => xPosition(timestamp) + seriesOffset;

            const description = document.createElement('p');
            description.id = 'history-chart-description';
            description.className = 'chart-description';
            description.textContent = 'Passed lines are solid, failed lines are dashed, timestamps are shown in UTC, and detailed point values are listed in the history data table below.';
            historyChart.appendChild(description);

            const svg = createSvgElement('svg', {
                viewBox: `0 0 ${width} ${height}`,
                role: 'img',
                'aria-labelledby': 'history-chart-title',
                'aria-describedby': 'history-chart-description'
            });
            const chartTitle = createSvgElement('title', { id: 'history-chart-title' });
            chartTitle.textContent = 'History chart of passed and failed test counts by suite over time';
            svg.appendChild(chartTitle);

            for (let tick = 0; tick <= yTickCount; tick += 1) {
                const value = tick * yStep;
                const y = yPosition(value);
                svg.appendChild(createSvgElement('line', { x1: margin.left, y1: y, x2: width - margin.right, y2: y, stroke: '#334155', 'stroke-width': 1 }));

                const label = createSvgElement('text', { x: margin.left - 10, y: y + 4, fill: '#94a3b8', 'font-size': 12, 'text-anchor': 'end' });
                label.textContent = String(value);
                svg.appendChild(label);
            }

            svg.appendChild(createSvgElement('line', { x1: margin.left, y1: margin.top, x2: margin.left, y2: height - margin.bottom, stroke: '#64748b', 'stroke-width': 1.5 }));
            svg.appendChild(createSvgElement('line', { x1: margin.left, y1: height - margin.bottom, x2: width - margin.right, y2: height - margin.bottom, stroke: '#64748b', 'stroke-width': 1.5 }));

            const tickTimestamps = hasSingleTimestamp
                ? [plottedTimestamps[0]]
                : (() => {
                    const requestedTickCount = Math.max(2, Math.floor(chartWidth / 150));
                    const tickCount = Math.min(plottedTimestamps.length, requestedTickCount);
                    const tickIndexes = [...new Set(Array.from({ length: tickCount }, (_, index) =>
                        Math.floor((index * (plottedTimestamps.length - 1)) / Math.max(tickCount - 1, 1))))];
                    return tickIndexes.map(index => plottedTimestamps[index]);
                })();

            tickTimestamps.forEach(timestamp => {
                const x = xPosition(timestamp);
                svg.appendChild(createSvgElement('line', { x1: x, y1: height - margin.bottom, x2: x, y2: height - margin.bottom + 6, stroke: '#64748b', 'stroke-width': 1 }));

                const label = createSvgElement('text', { x, y: height - margin.bottom + 20, fill: '#94a3b8', 'font-size': 11, 'text-anchor': 'middle' });
                const [datePart, timePart] = formatHistoryAxisDateParts(timestamp);
                const dateLine = createSvgElement('tspan', { x, dy: 0 });
                dateLine.textContent = datePart;
                const timeLine = createSvgElement('tspan', { x, dy: 14 });
                timeLine.textContent = timePart;
                label.append(dateLine, timeLine);
                svg.appendChild(label);
            });

            const yAxisLabel = createSvgElement('text', { x: 18, y: margin.top + (chartHeight / 2), fill: '#cbd5e1', 'font-size': 12, transform: `rotate(-90 18 ${margin.top + (chartHeight / 2)})`, 'text-anchor': 'middle' });
            yAxisLabel.textContent = 'Test count';
            svg.appendChild(yAxisLabel);

            const xAxisLabel = createSvgElement('text', { x: margin.left + (chartWidth / 2), y: height - 14, fill: '#cbd5e1', 'font-size': 12, 'text-anchor': 'middle' });
            xAxisLabel.textContent = 'Completed at (UTC)';
            svg.appendChild(xAxisLabel);

            series.forEach((seriesEntry, seriesIndex) => {
                const pathAttributes = {
                    d: seriesEntry.points
                        .map((point, pointIndex) => `${pointIndex === 0 ? 'M' : 'L'} ${pointXPosition(point.completedAt.valueOf(), getPointOffset(seriesIndex, pointIndex))} ${yPosition(point.value)}`)
                        .join(' '),
                    fill: 'none',
                    stroke: seriesEntry.color,
                    'stroke-width': 2.5,
                    'stroke-linecap': 'round',
                    'stroke-linejoin': 'round'
                };
                if (seriesEntry.dashed) {
                    pathAttributes['stroke-dasharray'] = '8 6';
                }

                const path = createSvgElement('path', pathAttributes);
                svg.appendChild(path);

                seriesEntry.points.forEach((point, pointIndex) => {
                    const circle = createSvgElement('circle', {
                        cx: pointXPosition(point.completedAt.valueOf(), getPointOffset(seriesIndex, pointIndex)),
                        cy: yPosition(point.value),
                        r: 3.5,
                        fill: seriesEntry.color
                    });
                    const title = createSvgElement('title');
                    title.textContent = `${seriesEntry.label}\n${point.report.runId}\n${formatHistoryDate(point.report.completedAt)}\n${point.value} tests`;
                    circle.appendChild(title);
                    svg.appendChild(circle);
                });
            });

            historyChart.appendChild(svg);

            const legend = document.createElement('ul');
            legend.className = 'chart-legend';
            series.forEach(seriesEntry => {
                const item = document.createElement('li');
                item.className = 'chart-legend-item';

                const swatch = document.createElement('span');
                swatch.className = `chart-swatch${seriesEntry.dashed ? ' chart-swatch-dashed' : ''}`;
                swatch.style.borderTopColor = seriesEntry.color;

                const label = document.createElement('span');
                label.textContent = seriesEntry.label;

                item.append(swatch, label);
                legend.appendChild(item);
            });

            historyChart.appendChild(legend);

            const dataTable = document.createElement('div');
            dataTable.className = 'chart-table';
            const table = document.createElement('table');
            const caption = document.createElement('caption');
            caption.textContent = 'History data table: suite passed and failed test counts by run completion time.';
            table.appendChild(caption);
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            ['Completed', 'Run', 'Suite', 'Passed', 'Failed'].forEach(label => {
                const header = document.createElement('th');
                header.scope = 'col';
                header.textContent = label;
                headerRow.appendChild(header);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            orderedReports.forEach(report => {
                (report?.summary?.suites ?? []).forEach(suiteSummary => {
                    const row = document.createElement('tr');
                    row.append(
                        createCell(formatHistoryDate(report.completedAt)),
                        createCell(report.runId),
                        createCell(formatSuite(suiteSummary?.suite)),
                        createCell(String(Number(suiteSummary?.passed) || 0)),
                        createCell(String(Number(suiteSummary?.failed) || 0))
                    );
                    tbody.appendChild(row);
                });
            });
            table.appendChild(tbody);
            dataTable.appendChild(table);
            historyChart.appendChild(dataTable);
        }

        function buildTestcaseHistory(reports) {
            const history = new Map();
            const orderedReports = reports
                .map((report, index) => ({
                    report,
                    index,
                    timestamp: parseTimestamp(report.completedAt)
                }))
                .sort((left, right) => {
                    if (left.timestamp !== null && right.timestamp !== null && left.timestamp !== right.timestamp) {
                        return right.timestamp - left.timestamp;
                    }

                    if (left.timestamp !== null && right.timestamp === null) {
                        return -1;
                    }

                    if (left.timestamp === null && right.timestamp !== null) {
                        return 1;
                    }

                    return left.index - right.index;
                });

            orderedReports.forEach(({ report, index, timestamp }) => {
                (report.results ?? []).forEach((result, resultIndex) => {
                    const testcaseKey = getTestcaseKey(report, result, resultIndex);
                    const existing = history.get(testcaseKey);
                    if (existing) {
                        existing.totalRuns += 1;
                        existing.passed += result.passed ? 1 : 0;
                        existing.failed += result.passed ? 0 : 1;
                        const shouldReplaceLatest = existing.latestTimestamp === null
                            ? timestamp !== null || index < existing.latestOrder
                            : timestamp !== null && (timestamp > existing.latestTimestamp || (timestamp === existing.latestTimestamp && index < existing.latestOrder));

                        if (shouldReplaceLatest) {
                            existing.displayName = result.testName;
                            existing.displaySuites = result.suites;
                            existing.latestPassed = result.passed;
                            existing.latestOutcome = result.outcome;
                            existing.latestCompletedAt = report.completedAt;
                            existing.latestTimestamp = timestamp;
                            existing.latestOrder = index;
                        }
                    } else {
                        history.set(testcaseKey, {
                            testCaseId: result.testCaseId,
                            displayName: result.testName,
                            displaySuites: result.suites,
                            totalRuns: 1,
                            passed: result.passed ? 1 : 0,
                            failed: result.passed ? 0 : 1,
                            latestPassed: result.passed,
                            latestOutcome: result.outcome,
                            latestCompletedAt: report.completedAt,
                            latestTimestamp: timestamp,
                            latestOrder: index
                        });
                    }
                });
            });

            return Array.from(history.values())
                .sort((left, right) => {
                    const leftName = left.displayName ?? left.testCaseId ?? '';
                    const rightName = right.displayName ?? right.testCaseId ?? '';
                    const nameComparison = leftName.localeCompare(rightName);
                    if (nameComparison !== 0) {
                        return nameComparison;
                    }

                    return (left.testCaseId ?? '').localeCompare(right.testCaseId ?? '');
                });
        }

        function renderTestcases(reports) {
            testcases.replaceChildren();
            const history = buildTestcaseHistory(reports);

            if (history.length === 0) {
                const empty = document.createElement('p');
                empty.textContent = 'No testcase history available.';
                testcases.appendChild(empty);
                return;
            }

            const table = document.createElement('table');
            const caption = document.createElement('caption');
            caption.textContent = 'All testcases history';
            table.appendChild(caption);
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            ['Testcase', 'Runs', 'Passed', 'Failed', 'Pass rate', 'Latest outcome', 'Latest run'].forEach(label => {
                const header = document.createElement('th');
                header.textContent = label;
                header.scope = 'col';
                headerRow.appendChild(header);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            history.forEach(entry => {
                const row = document.createElement('tr');

                const testCell = document.createElement('td');
                testCell.append(document.createTextNode(entry.displayName ?? entry.testCaseId ?? 'Unnamed testcase'));
                const suitesText = formatSuites(entry.displaySuites);
                if (suitesText) {
                    testCell.appendChild(document.createElement('br'));
                    const suites = document.createElement('small');
                    suites.textContent = suitesText;
                    testCell.appendChild(suites);
                }

                const latestOutcome = document.createElement('span');
                latestOutcome.className = statusClass(entry.latestPassed);
                latestOutcome.textContent = entry.latestOutcome ?? 'Unknown';

                row.append(
                    testCell,
                    createCell(String(entry.totalRuns)),
                    createCell(String(entry.passed)),
                    createCell(String(entry.failed)),
                    createCell(formatPassRate(entry.passed, entry.totalRuns)),
                    createCell(latestOutcome),
                    createCell(formatDateTime(entry.latestCompletedAt))
                );

                tbody.appendChild(row);
            });

            table.appendChild(tbody);
            testcases.appendChild(table);
        }

        async function getJson(url) {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`${url} returned ${response.status}`);
            }

            return response.json();
        }

        function render(summary, reports, sourceLabel) {
            errorBox.className = '';
            errorBox.textContent = '';
            sourceBox.textContent = `Showing data from ${sourceLabel}.`;
            metrics.replaceChildren();
            appendMetric('Runs', String(summary.totalRuns));
            appendMetric('Tests', String(summary.totalTests));
            appendMetric('Passed', String(summary.passedTests));
            appendMetric('Failed', String(summary.failedTests));
            appendMetric('Average pass rate', `${summary.averagePassRate}%`);
            renderHistoryChart(reports);

            runs.replaceChildren();
            reports.forEach(report => {
                const details = document.createElement('details');
                details.className = 'run';

                const summaryElement = document.createElement('summary');
                const summaryStatus = document.createElement('span');
                summaryStatus.className = statusClass(report.summary.failed === 0);
                summaryStatus.textContent = `${report.summary.passRate}%`;
                summaryElement.append(`${report.runId} · ${formatTrigger(report.triggerEvent)} · `, summaryStatus);

                const completed = document.createElement('p');
                completed.textContent = `Completed: ${new Date(report.completedAt).toLocaleString()}`;

                const stats = document.createElement('p');
                stats.textContent = `Analyzed endpoints: ${report.analysis.endpoints.length} · Executed tests: ${report.summary.total}`;

                const table = document.createElement('table');
                const headerRow = document.createElement('tr');
                ['Test', 'Status', 'Request', 'Response'].forEach(label => {
                    const header = document.createElement('th');
                    header.textContent = label;
                    headerRow.appendChild(header);
                });
                const thead = document.createElement('thead');
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                report.results.forEach(result => {
                    const row = document.createElement('tr');

                    const testCell = document.createElement('td');
                    testCell.append(document.createTextNode(result.testName));
                    testCell.appendChild(document.createElement('br'));
                    const suites = document.createElement('small');
                    suites.textContent = formatSuites(result.suites);
                    testCell.appendChild(suites);

                    const statusCell = document.createElement('td');
                    statusCell.className = statusClass(result.passed);
                    statusCell.textContent = result.outcome;

                    const requestText = `${result.request.method} ${result.request.url}\n${result.request.body ?? ''}`;
                    const responseText = `Status: ${result.response.statusCode ?? 'error'}\n${result.response.body ?? result.response.error ?? ''}`;

                    row.append(testCell, statusCell, createCell(createCodeBlock(requestText)), createCell(createCodeBlock(responseText)));
                    tbody.appendChild(row);
                });

                table.appendChild(tbody);
                details.append(summaryElement, completed, stats, table);
                runs.appendChild(details);
            });

            renderTestcases(reports);
        }

        async function load() {
            let lastError = null;

            for (const source of sources) {
                try {
                    const [summary, reports] = await Promise.all([
                        getJson(source.summaryUrl),
                        getJson(source.runsUrl)
                    ]);

                    render(summary, reports, source.label);
                    return;
                } catch (error) {
                    lastError = error;
                }
            }

            metrics.replaceChildren();
            historyChart.replaceChildren();
            runs.replaceChildren();
            testcases.replaceChildren();
            sourceBox.textContent = '';
            errorBox.className = 'error';
            errorBox.textContent = lastError instanceof Error ? lastError.message : 'Dashboard failed to load.';
        }

        load();
    </script>
</body>
</html>
