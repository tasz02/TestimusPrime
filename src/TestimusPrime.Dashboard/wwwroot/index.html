<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestimusPrime Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card, details, .error { background: #1e293b; border-radius: 12px; padding: 1rem; border: 1px solid #334155; }
        .chart-card { margin-bottom: 2rem; overflow-x: auto; }
        .chart-card svg { display: block; width: 100%; min-width: 720px; height: auto; }
        .chart-legend { display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; margin-top: 1rem; font-size: 0.9rem; color: #cbd5e1; }
        .chart-legend-item { display: inline-flex; align-items: center; gap: 0.5rem; }
        .chart-swatch { width: 1.75rem; height: 0; border-top-width: 3px; border-top-style: solid; }
        .chart-swatch.failed { border-top-style: dashed; }
        .chart-description { color: #cbd5e1; margin: 0 0 1rem; }
        .chart-empty { color: #94a3b8; margin: 0; }
        .chart-table { margin-top: 1rem; }
        .chart-table-title { color: #cbd5e1; font-weight: 600; margin: 0 0 0.75rem; }
        h1, h2 { margin-top: 0; }
        .run { margin-bottom: 1rem; }
        .error { border-color: #ef4444; color: #fecaca; margin-bottom: 1rem; }
        .source { color: #94a3b8; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #334155; vertical-align: top; }
        .passed { color: #4ade80; }
        .failed { color: #f87171; }
        code { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <h1>TestimusPrime Dashboard</h1>
    <div id="error"></div>
    <div id="source" class="source"></div>
    <div id="metrics" class="metrics"></div>
    <h2 id="history-heading">History</h2>
    <div id="history-chart" class="card chart-card"></div>
    <h2>Recent runs</h2>
    <div id="runs"></div>
    <script>
        const errorBox = document.getElementById('error');
        const sourceBox = document.getElementById('source');
        const metrics = document.getElementById('metrics');
        const historyChart = document.getElementById('history-chart');
        const runs = document.getElementById('runs');
        const svgNamespace = 'http://www.w3.org/2000/svg';
        const triggerLabels = { 0: 'Commit', 1: 'PullRequest', Commit: 'Commit', PullRequest: 'PullRequest' };
        const suiteLabels = { 0: 'Smoke', 1: 'Regression', Smoke: 'Smoke', Regression: 'Regression' };
        const sources = [
            { label: 'live API', summaryUrl: 'api/summary', runsUrl: 'api/runs' },
            { label: 'published history', summaryUrl: 'data/summary.json', runsUrl: 'data/runs.json' }
        ];
        const seriesPalette = ['#4ade80', '#f87171', '#60a5fa', '#fbbf24', '#c084fc', '#fb7185', '#22d3ee', '#f97316'];

        const appendMetric = (label, value) => {
            const card = document.createElement('div');
            card.className = 'card';
            const strong = document.createElement('strong');
            strong.textContent = label;
            const content = document.createElement('div');
            content.textContent = value;
            card.append(strong, content);
            metrics.appendChild(card);
        };

        const createCodeBlock = text => {
            const code = document.createElement('code');
            code.textContent = text;
            return code;
        };

        const createSvgElement = (name, attributes = {}) => {
            const element = document.createElementNS(svgNamespace, name);
            Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, String(value)));
            return element;
        };

        const createCell = content => {
            const cell = document.createElement('td');
            if (typeof content === 'string') {
                cell.textContent = content;
            } else {
                cell.appendChild(content);
            }
            return cell;
        };

        const statusClass = passed => passed ? 'passed' : 'failed';
        const formatTrigger = trigger => triggerLabels[trigger] ?? String(trigger ?? 'Unknown');
        const formatSuite = suite => suiteLabels[suite] ?? String(suite ?? 'Unknown');
        const formatSuites = suites => (Array.isArray(suites) ? suites.map(suite => suiteLabels[suite] ?? String(suite)) : []).join(', ');
        const formatHistoryDate = value => new Date(value).toLocaleString();

        function renderHistoryChart(reports) {
            historyChart.replaceChildren();

            const orderedReports = reports
                .filter(report => report?.completedAt)
                .slice()
                .sort((left, right) => new Date(left.completedAt) - new Date(right.completedAt));

            const suiteNames = [...new Set(orderedReports.flatMap(report =>
                Array.isArray(report?.summary?.suites)
                    ? report.summary.suites.map(suiteSummary => formatSuite(suiteSummary?.suite))
                    : []))];

            if (orderedReports.length === 0 || suiteNames.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'chart-empty';
                empty.textContent = 'No suite history available yet.';
                historyChart.appendChild(empty);
                return;
            }

            const series = suiteNames.flatMap((suiteName, index) => {
                const baseColor = seriesPalette[(index * 2) % seriesPalette.length];
                const failedColor = seriesPalette[(index * 2 + 1) % seriesPalette.length];
                const points = orderedReports
                    .map(report => {
                        const suiteSummary = Array.isArray(report?.summary?.suites)
                            ? report.summary.suites.find(candidate => formatSuite(candidate?.suite) === suiteName)
                            : null;
                        if (!suiteSummary) {
                            return null;
                        }

                        const completedAt = new Date(report.completedAt);
                        if (Number.isNaN(completedAt.valueOf())) {
                            return null;
                        }

                        return {
                            report,
                            completedAt,
                            passed: Number(suiteSummary.passed) || 0,
                            failed: Number(suiteSummary.failed) || 0
                        };
                    })
                    .filter(point => point !== null);

                return [
                    { label: `${suiteName} Passed`, color: baseColor, dashed: false, points: points.map(point => ({ ...point, value: point.passed })) },
                    { label: `${suiteName} Failed`, color: failedColor, dashed: true, points: points.map(point => ({ ...point, value: point.failed })) }
                ];
            }).filter(seriesEntry => seriesEntry.points.length > 0);

            if (series.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'chart-empty';
                empty.textContent = 'No suite history available yet.';
                historyChart.appendChild(empty);
                return;
            }

            const timestamps = orderedReports
                .map(report => new Date(report.completedAt).valueOf())
                .filter(timestamp => !Number.isNaN(timestamp));
            const minTime = Math.min(...timestamps);
            const maxTime = Math.max(...timestamps);
            const maxValue = Math.max(1, ...series.flatMap(seriesEntry => seriesEntry.points.map(point => point.value)));
            const yTickCount = 4;
            const yStep = Math.max(1, Math.ceil(maxValue / yTickCount));
            const yMax = yStep * yTickCount;
            const width = 960;
            const height = 360;
            const margin = { top: 24, right: 24, bottom: 72, left: 60 };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;
            const timeSpan = Math.max(maxTime - minTime, 1);
            const xPosition = timestamp => margin.left + (((timestamp - minTime) / timeSpan) * chartWidth);
            const yPosition = value => margin.top + chartHeight - ((value / yMax) * chartHeight);

            const description = document.createElement('p');
            description.id = 'history-chart-description';
            description.className = 'chart-description';
            description.textContent = 'Passed lines are solid, failed lines are dashed, and detailed point values are listed in the history data table below.';
            historyChart.appendChild(description);

            const svg = createSvgElement('svg', {
                viewBox: `0 0 ${width} ${height}`,
                role: 'img',
                'aria-labelledby': 'history-heading history-chart-title',
                'aria-describedby': 'history-chart-description'
            });
            const chartTitle = createSvgElement('title', { id: 'history-chart-title' });
            chartTitle.textContent = 'Suite pass and fail history chart';
            svg.appendChild(chartTitle);

            for (let tick = 0; tick <= yTickCount; tick += 1) {
                const value = tick * yStep;
                const y = yPosition(value);
                svg.appendChild(createSvgElement('line', { x1: margin.left, y1: y, x2: width - margin.right, y2: y, stroke: '#334155', 'stroke-width': 1 }));

                const label = createSvgElement('text', { x: margin.left - 10, y: y + 4, fill: '#94a3b8', 'font-size': 12, 'text-anchor': 'end' });
                label.textContent = String(value);
                svg.appendChild(label);
            }

            svg.appendChild(createSvgElement('line', { x1: margin.left, y1: margin.top, x2: margin.left, y2: height - margin.bottom, stroke: '#64748b', 'stroke-width': 1.5 }));
            svg.appendChild(createSvgElement('line', { x1: margin.left, y1: height - margin.bottom, x2: width - margin.right, y2: height - margin.bottom, stroke: '#64748b', 'stroke-width': 1.5 }));

            const xTickIndexes = [...new Set(Array.from({ length: Math.min(orderedReports.length, 5) }, (_, index) =>
                Math.round((index * (orderedReports.length - 1)) / Math.max(Math.min(orderedReports.length, 5) - 1, 1))))];

            xTickIndexes.forEach(reportIndex => {
                const report = orderedReports[reportIndex];
                const x = xPosition(new Date(report.completedAt).valueOf());
                svg.appendChild(createSvgElement('line', { x1: x, y1: height - margin.bottom, x2: x, y2: height - margin.bottom + 6, stroke: '#64748b', 'stroke-width': 1 }));

                const label = createSvgElement('text', { x, y: height - margin.bottom + 22, fill: '#94a3b8', 'font-size': 12, 'text-anchor': 'middle' });
                label.textContent = formatHistoryDate(report.completedAt);
                svg.appendChild(label);
            });

            const yAxisLabel = createSvgElement('text', { x: 18, y: margin.top + (chartHeight / 2), fill: '#cbd5e1', 'font-size': 12, transform: `rotate(-90 18 ${margin.top + (chartHeight / 2)})`, 'text-anchor': 'middle' });
            yAxisLabel.textContent = 'Test count';
            svg.appendChild(yAxisLabel);

            const xAxisLabel = createSvgElement('text', { x: margin.left + (chartWidth / 2), y: height - 18, fill: '#cbd5e1', 'font-size': 12, 'text-anchor': 'middle' });
            xAxisLabel.textContent = 'Completed at';
            svg.appendChild(xAxisLabel);

            series.forEach(seriesEntry => {
                const path = createSvgElement('path', {
                    d: seriesEntry.points
                        .map((point, pointIndex) => `${pointIndex === 0 ? 'M' : 'L'} ${xPosition(point.completedAt.valueOf())} ${yPosition(point.value)}`)
                        .join(' '),
                    fill: 'none',
                    stroke: seriesEntry.color,
                    'stroke-width': 3,
                    'stroke-dasharray': seriesEntry.dashed ? '8 6' : 'none',
                    'stroke-linecap': 'round',
                    'stroke-linejoin': 'round'
                });
                svg.appendChild(path);

                seriesEntry.points.forEach(point => {
                    const circle = createSvgElement('circle', {
                        cx: xPosition(point.completedAt.valueOf()),
                        cy: yPosition(point.value),
                        r: 4,
                        fill: seriesEntry.color
                    });
                    const title = createSvgElement('title');
                    title.textContent = `${seriesEntry.label}\n${point.report.runId}\n${formatHistoryDate(point.report.completedAt)}\n${point.value} tests`;
                    circle.appendChild(title);
                    svg.appendChild(circle);
                });
            });

            historyChart.appendChild(svg);

            const legend = document.createElement('div');
            legend.className = 'chart-legend';
            series.forEach(seriesEntry => {
                const item = document.createElement('span');
                item.className = 'chart-legend-item';

                const swatch = document.createElement('span');
                swatch.className = `chart-swatch${seriesEntry.dashed ? ' failed' : ''}`;
                swatch.style.borderTopColor = seriesEntry.color;

                const label = document.createElement('span');
                label.textContent = seriesEntry.label;

                item.append(swatch, label);
                legend.appendChild(item);
            });

            historyChart.appendChild(legend);

            const dataTable = document.createElement('div');
            dataTable.className = 'chart-table';
            const dataTableTitle = document.createElement('p');
            dataTableTitle.className = 'chart-table-title';
            dataTableTitle.textContent = 'History data table';
            dataTable.appendChild(dataTableTitle);
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            ['Completed', 'Run', 'Suite', 'Passed', 'Failed'].forEach(label => {
                const header = document.createElement('th');
                header.textContent = label;
                headerRow.appendChild(header);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            orderedReports.forEach(report => {
                (report?.summary?.suites ?? []).forEach(suiteSummary => {
                    const row = document.createElement('tr');
                    row.append(
                        createCell(formatHistoryDate(report.completedAt)),
                        createCell(report.runId),
                        createCell(formatSuite(suiteSummary?.suite)),
                        createCell(String(Number(suiteSummary?.passed) || 0)),
                        createCell(String(Number(suiteSummary?.failed) || 0))
                    );
                    tbody.appendChild(row);
                });
            });
            table.appendChild(tbody);
            dataTable.appendChild(table);
            historyChart.appendChild(dataTable);
        }

        async function getJson(url) {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`${url} returned ${response.status}`);
            }

            return response.json();
        }

        function render(summary, reports, sourceLabel) {
            errorBox.className = '';
            errorBox.textContent = '';
            sourceBox.textContent = `Showing data from ${sourceLabel}.`;
            metrics.replaceChildren();
            appendMetric('Runs', String(summary.totalRuns));
            appendMetric('Tests', String(summary.totalTests));
            appendMetric('Passed', String(summary.passedTests));
            appendMetric('Failed', String(summary.failedTests));
            appendMetric('Average pass rate', `${summary.averagePassRate}%`);
            renderHistoryChart(reports);

            runs.replaceChildren();
            reports.forEach(report => {
                const details = document.createElement('details');
                details.className = 'run';

                const summaryElement = document.createElement('summary');
                const summaryStatus = document.createElement('span');
                summaryStatus.className = statusClass(report.summary.failed === 0);
                summaryStatus.textContent = `${report.summary.passRate}%`;
                summaryElement.append(`${report.runId} · ${formatTrigger(report.triggerEvent)} · `, summaryStatus);

                const completed = document.createElement('p');
                completed.textContent = `Completed: ${new Date(report.completedAt).toLocaleString()}`;

                const stats = document.createElement('p');
                stats.textContent = `Analyzed endpoints: ${report.analysis.endpoints.length} · Executed tests: ${report.summary.total}`;

                const table = document.createElement('table');
                const headerRow = document.createElement('tr');
                ['Test', 'Status', 'Request', 'Response'].forEach(label => {
                    const header = document.createElement('th');
                    header.textContent = label;
                    headerRow.appendChild(header);
                });
                const thead = document.createElement('thead');
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                report.results.forEach(result => {
                    const row = document.createElement('tr');

                    const testCell = document.createElement('td');
                    testCell.append(document.createTextNode(result.testName));
                    testCell.appendChild(document.createElement('br'));
                    const suites = document.createElement('small');
                    suites.textContent = formatSuites(result.suites);
                    testCell.appendChild(suites);

                    const statusCell = document.createElement('td');
                    statusCell.className = statusClass(result.passed);
                    statusCell.textContent = result.outcome;

                    const requestText = `${result.request.method} ${result.request.url}\n${result.request.body ?? ''}`;
                    const responseText = `Status: ${result.response.statusCode ?? 'error'}\n${result.response.body ?? result.response.error ?? ''}`;

                    row.append(testCell, statusCell, createCell(createCodeBlock(requestText)), createCell(createCodeBlock(responseText)));
                    tbody.appendChild(row);
                });

                table.appendChild(tbody);
                details.append(summaryElement, completed, stats, table);
                runs.appendChild(details);
            });
        }

        async function load() {
            let lastError = null;

            for (const source of sources) {
                try {
                    const [summary, reports] = await Promise.all([
                        getJson(source.summaryUrl),
                        getJson(source.runsUrl)
                    ]);

                    render(summary, reports, source.label);
                    return;
                } catch (error) {
                    lastError = error;
                }
            }

            metrics.replaceChildren();
            historyChart.replaceChildren();
            runs.replaceChildren();
            sourceBox.textContent = '';
            errorBox.className = 'error';
            errorBox.textContent = lastError instanceof Error ? lastError.message : 'Dashboard failed to load.';
        }

        load();
    </script>
</body>
</html>
